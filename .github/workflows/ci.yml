name: CI

# Everything here runs without a configured StarCraft II project.  The full
# "python tools/test-suite.py" needs agent-config.json and an installed mod, so it
# is intentionally not part of CI - it is the local pre-flight gate instead.

on:
  push:
  pull_request:

jobs:
  test:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Unit tests (pytest)
        run: python -m pytest tools/tests -q

      - name: Agent-facing pre-flight contract (tools scope)
        run: python tools/test-suite.py --scope tools

      - name: Skill frontmatter and documentation links
        run: |
          python tools/audit-skill-frontmatter.py
          python tools/check-doc-links.py

      - name: Package dry run (portability scan)
        run: python tools/package.py --quiet
