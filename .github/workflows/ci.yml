name: CI

# Runs on Windows on purpose.
#
# This kit drives the StarCraft II Editor, shells out to PowerShell and curl.exe, and
# ships .exe binaries - SC2 modding is a Windows workflow.  The path handling under test
# (sc2_paths.py, init-project.py, deploy-mod.py) operates on Windows drive-letter paths
# like E:/Games/StarCraft II/Mods; on Linux, Path.resolve() treats that as a relative path
# and every path assertion fails for reasons that cannot happen for a real user.
#
# Everything here runs WITHOUT a configured StarCraft II project.  The full
# "python tools/test-suite.py" needs agent-config.json and an installed mod, so it is
# intentionally not part of CI - it is the local pre-flight gate instead.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Unit tests (pytest)
        run: python -m pytest tools/tests -q

      - name: Agent-facing pre-flight contract (tools scope)
        run: python tools/test-suite.py --scope tools

      - name: Skill frontmatter and documentation links
        run: |
          python tools/audit-skill-frontmatter.py
          python tools/check-doc-links.py

      - name: Static rules
        run: python tools/sc2.py check .

      - name: Release build dry run
        run: python tools/release.py
