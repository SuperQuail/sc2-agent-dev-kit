<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>StarCraftIIAgent 安装器</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>StarCraftIIAgent 安装器</h1>
  <p class="sub">安装套件本体，并把技能交付给已检测到的 harness。<b>不会打开任何 harness。</b></p>
</header>
<main>
  <section>
    <h2>1 · 来源</h2>
    <div class="row">
      <input id="source" type="text" placeholder="GitHub release（owner/repo 或 owner/repo@tag）／本地发行目录／本地 zip">
      <button id="pick-dir" class="ghost">选目录</button>
      <button id="pick-zip" class="ghost">选 zip</button>
    </div>
    <p class="hint">也可以填 `owner/repo@v0.1.0`，安装器会从 release 资产里取清单与包。</p>
  </section>
  <section>
    <h2>2 · 目标 harness</h2>
    <div id="harnesses" class="harness-list"></div>
  </section>
  <section>
    <h2>3 · 安装位置</h2>
    <div class="row"><code id="root"></code></div>
    <p class="hint">套件只装一份；各 harness 只收到技能（已拍平为 &lt;skills-dir&gt;/&lt;名称&gt;/）。</p>
  </section>
  <section>
    <h2>4 · 差异预览</h2>
    <div id="plan" class="plan">点「预演」查看将要发生什么。</div>
  </section>
  <div class="actions">
    <button id="preview" class="ghost">预演</button>
    <button id="install" class="primary">开始安装</button>
  </div>
  <section>
    <h2>日志</h2>
    <pre id="log"></pre>
  </section>
</main>
<script src="renderer.js"></script>
</body>
</html>
